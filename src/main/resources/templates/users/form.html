<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title th:text="${isEdit ? 'Chỉnh Sửa Người Dùng' : 'Thêm Người Dùng Mới'}">Người Dùng - Shop Web</title>
</head>
<body>
<div layout:fragment="content">
    <div style="max-width: 680px; margin: 0 auto;">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
            <div>
                <h1 style="font-size: 24px; font-weight: 800; color: var(--text-main);"
                    th:text="${isEdit ? 'Chỉnh Sửa Người Dùng' : 'Thêm Người Dùng Mới'}">Tiêu đề</h1>
                <p style="color: var(--text-muted); font-size: 14px;">
                    <span th:if="${!isEdit}">Mật khẩu mặc định khởi tạo là: <strong>123456</strong></span>
                    <span th:if="${isEdit}">Cập nhật thông tin và phân quyền vai trò</span>
                </p>
            </div>
            <a th:href="@{/users}" class="btn btn-secondary btn-sm">&larr; Quay lại danh sách</a>
        </div>

        <div class="card">
            <div class="card-body">
                <form th:action="${isEdit ? '/users/edit/' + user.id : '/users/create'}"
                      th:object="${user}"
                      method="post">

                    <div class="form-group">
                        <label for="username" class="form-label">Tên đăng nhập *</label>
                        <input type="text" id="username" th:field="*{username}" class="form-control"
                               th:readonly="${isEdit}"
                               th:style="${isEdit ? 'background-color: #f8fafc;' : ''}"
                               placeholder="nguyenvana" required>
                        <span class="form-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                    </div>

                    <div class="form-group">
                        <label for="fullName" class="form-label">Họ và tên *</label>
                        <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                               placeholder="Nguyễn Văn A" required>
                        <span class="form-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                        <div class="form-group">
                            <label for="email" class="form-label">Email *</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   placeholder="a@example.com" required>
                            <span class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                        </div>

                        <div class="form-group">
                            <label for="phone" class="form-label">Số điện thoại</label>
                            <input type="text" id="phone" th:field="*{phone}" class="form-control"
                                   placeholder="0912345678">
                            <span class="form-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password" class="form-label">
                            <span th:if="${!isEdit}">Mật khẩu (Để trống sẽ lấy mặc định: 123456)</span>
                            <span th:if="${isEdit}">Mật khẩu mới (Để trống nếu không muốn thay đổi)</span>
                        </label>
                        <input type="password" id="password" th:field="*{password}" class="form-control"
                               placeholder="Nhập mật khẩu...">
                        <span class="form-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phân quyền vai trò (Roles) *</label>
                        <div style="display: flex; gap: 20px; margin-top: 6px;">
                            <div th:each="role : ${allRoles}" class="form-check">
                                <input type="checkbox" th:field="*{roles}" th:value="${role.name}"
                                       th:id="${'role_' + role.name}" style="cursor: pointer;">
                                <label th:for="${'role_' + role.name}" th:text="${role.name}"
                                       style="cursor: pointer; font-size: 14px; font-weight: 600;"></label>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="form-check" style="background-color: #f8fafc; padding: 12px; border-radius: var(--radius); border: 1px solid var(--border);">
                            <input type="checkbox" id="enabled" th:field="*{enabled}" style="cursor: pointer; width: 18px; height: 18px;">
                            <label for="enabled" style="cursor: pointer; font-size: 14px; font-weight: 600; margin-left: 8px;">
                                Kích hoạt tài khoản ngay (Enabled)
                            </label>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                        <a th:href="@{/users}" class="btn btn-secondary">Hủy bỏ</a>
                        <button type="submit" class="btn btn-primary"
                                th:text="${isEdit ? 'Lưu Thay Đổi' : 'Thêm Người Dùng'}">
                            Xác nhận
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </div>
</div>
</body>
</html>
