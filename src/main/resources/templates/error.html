<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Thông Báo Lỗi - Shop Web</title>
</head>
<body>
<div layout:fragment="content">
    <div style="max-width: 520px; margin: 60px auto; text-align: center;">
        <div style="width: 80px; height: 80px; background-color: #fee2e2; color: #ef4444; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 24px;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
        </div>
        <h1 style="font-size: 28px; font-weight: 800; color: var(--text-main); margin-bottom: 12px;" th:text="${errorTitle}">
            Đã xảy ra lỗi
        </h1>
        <p style="color: var(--text-muted); font-size: 15px; margin-bottom: 30px;" th:text="${errorDescription}">
            Không thể hoàn tất yêu cầu của bạn.
        </p>
        <div style="display: flex; justify-content: center; gap: 12px;">
            <a th:href="@{/}" class="btn btn-primary">Về Trang Chủ</a>
            <a href="javascript:history.back()" class="btn btn-secondary">Quay Lại</a>
        </div>
    </div>
</div>
</body>
</html>
