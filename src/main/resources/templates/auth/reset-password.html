<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Đặt Lại Mật Khẩu - Shop Web</title>
</head>
<body>
<div layout:fragment="content">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div style="width: 56px; height: 56px; background-color: var(--primary-light); color: var(--primary); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 2l-2 2m-2-2l2 2"></path>
                        <path d="M3 7v6h6"></path>
                        <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
                    </svg>
                </div>
                <h2 class="auth-title">Đặt Lại Mật Khẩu</h2>
                <p class="auth-subtitle">Nhập mã OTP đã nhận và mật khẩu mới của bạn</p>
            </div>

            <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post">
                <div class="form-group">
                    <label for="email" class="form-label">Email tài khoản *</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control"
                           placeholder="name@example.com" required>
                    <span class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>

                <div class="form-group">
                    <label for="otpCode" class="form-label">Mã OTP (6 chữ số) *</label>
                    <input type="text" id="otpCode" th:field="*{otpCode}" class="form-control"
                           maxlength="6" 
                           style="text-align: center; letter-spacing: 6px; font-size: 18px; font-weight: 700;"
                           required autofocus>
                    <span class="form-error" th:if="${#fields.hasErrors('otpCode')}" th:errors="*{otpCode}"></span>
                </div>

                <div class="form-group">
                    <label for="newPassword" class="form-label">Mật khẩu mới *</label>
                    <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control"
                           placeholder="Tối thiểu 6 ký tự" required>
                    <span class="form-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới *</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control"
                           placeholder="Nhập lại mật khẩu mới" required>
                    <span class="form-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">
                    Cập Nhật Mật Khẩu
                </button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
