<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">
<head>
    <title>Quên Mật Khẩu - Shop Web</title>
</head>
<body>
<div layout:fragment="content">
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div style="width: 56px; height: 56px; background-color: #fef3c7; color: #d97706; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <h2 class="auth-title">Quên Mật Khẩu</h2>
                <p class="auth-subtitle">Nhập email đăng ký của bạn để nhận mã xác thực đặt lại mật khẩu</p>
            </div>

            <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post">
                <div class="form-group">
                    <label for="email" class="form-label">Email tài khoản *</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control"
                           placeholder="name@example.com" required autofocus>
                    <span class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">
                    Gửi Mã Xác Thực OTP
                </button>

                <div style="text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-muted);">
                    Nhớ mật khẩu rồi?
                    <a th:href="@{/login}" style="font-weight: 700;">Đăng nhập</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
